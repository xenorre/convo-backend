name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps (prod only)
        run: npm ci --omit=dev
      - name: Env validation (dev defaults)
        env:
          NODE_ENV: development
          DATABASE_URL: mongodb://localhost:27017/convo
          JWT_SECRET: test_secret
        run: node -e "import('./src/config/env.js').then(()=>console.log('env ok')).catch(e=>{console.error(e);process.exit(1)})"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: convo-backend:ci