version: '3.8'

# ConvoChat Full Stack Development Environment
# This compose file runs both backend and frontend services together

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: convochat-backend
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debugger port
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mongodb://mongodb:27017/convochat_dev?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=dev-session-secret-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://frontend:3000
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    command: npm run dev
    depends_on:
      - mongodb
      - redis
    networks:
      - convochat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (assuming it exists in ../convo-frontend)
  frontend:
    build:
      context: ../convo-frontend
      dockerfile: Dockerfile.dev
    container_name: convochat-frontend
    ports:
      - "3001:3000"  # Map to different port to avoid backend conflict
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=ws://localhost:3000
      - PORT=3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../convo-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - convochat-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: convochat-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=convochat_dev
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - convochat-network
    restart: unless-stopped
    command: ["bash", "-c", "\
      mongod --replSet rs0 --bind_ip_all --oplogSize 128 & \
      pid=$!; \
      echo 'Waiting for mongod to accept connections...'; \
      until mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; do sleep 1; done; \
      echo 'Initializing replica set (if needed)...'; \
      mongosh --quiet --eval 'try { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"localhost:27017\"}]}) } catch(e) { rs.status() }'; \
      wait $pid"]

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: convochat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - convochat-network
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf

  # MongoDB Express (Database Admin UI)
  mongo-express:
    image: mongo-express:1.0.0-alpha
    container_name: convochat-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/convochat_dev?replicaSet=rs0&directConnection=true
    depends_on:
      - mongodb
    networks:
      - convochat-network
    restart: unless-stopped

  # Redis Commander (Redis Admin UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: convochat-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    depends_on:
      - redis
    networks:
      - convochat-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: convochat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - convochat-network
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  convochat-network:
    driver: bridge
